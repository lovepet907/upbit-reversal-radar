name: Upbit Hourly Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: write

concurrency:
  group: upbit-radar
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and analyze Upbit candles
        run: python analyzer.py

      - name: Save latest JSON to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Upbit reversal radar data'
            git push
          fi
